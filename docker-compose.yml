# generated by gosite generate from gosite.yml - do not edit.
# `gosite generate` rewrites this file. Put local changes in docker-compose.override.yml.
#
# Local development stack for konex-landing.
# Redis and MongoDB are NOT defined here: they are the shared gosite
# infrastructure, reachable by container name on the external network.
# Start them with `gosite infra up`.

services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile.dev
    container_name: konex-landing-app
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
      APP_ENV: development
      REDIS_URL: "redis://gosite-redis:6379/0"
      COCKPIT_URL: "http://konex-landing-cms:80"
      GOSITE_PROJECT: "konex-landing"
    # Host ports stay mapped as a fallback; the domain below is the main entry.
    ports:
      - "8004:8080"
    labels:
      - traefik.enable=true
      - traefik.docker.network=gosite-network
      - traefik.http.routers.konex-landing-app.rule=Host(`konex-landing.test`)
      - traefik.http.routers.konex-landing-app.entrypoints=websecure
      - traefik.http.routers.konex-landing-app.tls=true
      - traefik.http.services.konex-landing-app.loadbalancer.server.port=8080
    volumes:
      # Live source mount: air rebuilds on save.
      - .:/app
      # Named volumes keep the module cache and build artifacts off the host FS.
      - konex-landing-gomod:/go/pkg/mod
      - konex-landing-tmp:/app/tmp
    depends_on:
      - cms
    networks:
      - gosite

  cms:
    build:
      context: .
      dockerfile: deploy/Dockerfile.cms
      # gosite's Cockpit addons, from the gosite installation that generated
      # this file. Production fetches the same directory at the core version.
      additional_contexts:
        gosite-addons: "/home/guarapo/.local/share/gosite/src/addons"
    container_name: konex-landing-cms
    restart: unless-stopped
    environment:
      # Cockpit reads these through config.php's ${VAR} resolution.
      COCKPIT_SESSION_NAME: "konex-landing"
      COCKPIT_SEC_KEY: "${COCKPIT_SEC_KEY}"
      COCKPIT_MEMORY_SERVER: "redis://gosite-redis:6379"
      COCKPIT_DATABASE: "mongodb"
      MONGO_HOST: "gosite-mongo"
      MONGO_PORT: "27017"
      MONGO_DB: "konex-landing"
      STORAGE_ADAPTER: "${STORAGE_ADAPTER}"
      S3_URL: "${S3_URL}"
      S3_BUCKET: "${S3_BUCKET}"
      S3_REGION: "${S3_REGION}"
      S3_KEY: "${S3_KEY}"
      S3_SECRET: "${S3_SECRET}"
      S3_PREFIX: "${S3_PREFIX}"
      S3_PUBLIC_URL: "${S3_PUBLIC_URL}"
      S3_ACL: "${S3_ACL:-}"
      S3_VERIFY: "${S3_VERIFY:-true}"
      # Outgoing e-mail (optional - see cockpit/config.php). Empty = no SMTP.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-}"
      SMTP_ENCRYPTION: "${SMTP_ENCRYPTION:-}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-}"
      # CachePurge addon: the Go app's internal address and shared token so
      # Cockpit can POST to /cache/purge when content changes or Replica syncs.
      # The container name, not the service name: every gosite project has a
      # service called "app" and they all share gosite-network, so "app" resolves
      # to whichever neighbour Docker feels like - and this project's cache purge
      # lands on someone else's site.
      APP_URL: "http://konex-landing-app:8080"
      COCKPIT_API_TOKEN: "${COCKPIT_API_TOKEN}"
    ports:
      - "8005:80"
    labels:
      - traefik.enable=true
      - traefik.docker.network=gosite-network
      - traefik.http.routers.konex-landing-cms.rule=Host(`cms.konex-landing.test`)
      - traefik.http.routers.konex-landing-cms.entrypoints=websecure
      - traefik.http.routers.konex-landing-cms.tls=true
      - traefik.http.services.konex-landing-cms.loadbalancer.server.port=80
    volumes:
      # Config and addons are baked into the image by Dockerfile.cms, not
      # bind-mounted: relative mounts resolve against the directory where
      # Coolify stores the pasted compose file, not the repo checkout, and
      # silently mount empty directories. Storage stays on a volume.
      - ./cockpit-storage:/var/www/html/storage
    networks:
      - gosite

volumes:
  konex-landing-gomod:
  konex-landing-tmp:

networks:
  gosite:
    external: true
    name: gosite-network
