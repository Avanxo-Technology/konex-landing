# Local changes to the development stack. `gosite generate` rewrites
# docker-compose.yml but never this file, and `gosite start` merges it in.
#
# Example: an extra environment variable for the app.
#   services:
#     app:
#       environment:
#         FEATURE_FLAG: "on"

services:
  app:
    environment:
      # The source is bind-mounted from the host, so git inside the container
      # refuses it ("dubious ownership") and `go build` fails stamping VCS info.
      GOFLAGS: "-buildvcs=false"
